<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미니 그림판 · 레이어</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#24282e;background:#e8ebf0}*{box-sizing:border-box}body{margin:0}header{height:54px;display:flex;align-items:center;gap:9px;padding:8px 14px;background:#fff;border-bottom:1px solid #ccd1d9;flex-wrap:wrap}h1{font-size:16px;margin:0 14px 0 0;white-space:nowrap}button,.upload{border:1px solid #c8cdd6;background:white;border-radius:7px;padding:7px 10px;cursor:pointer;font-size:13px}button:hover,.upload:hover{background:#f0f5fa}button.active{background:#dcecff;border-color:#639cde}button:disabled{opacity:.4;cursor:default}input[type=range]{vertical-align:middle}input[type=color]{width:34px;height:31px;border:0;padding:0;background:transparent;vertical-align:middle}main{display:grid;grid-template-columns:minmax(0,1fr) 262px;height:calc(100vh - 54px);min-height:360px}.workspace{position:relative;background:#d7dce3;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:28px}#paper{position:relative;width:1000px;height:700px;flex:none;background:white;box-shadow:0 2px 12px #0002;touch-action:none;cursor:crosshair}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:auto}.sidebar{background:#fff;border-left:1px solid #cbd1d9;padding:15px;overflow-y:auto}.sidebar h2{margin:0 0 15px;font-size:15px}.btns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}#layers{display:flex;flex-direction:column;gap:6px}.layer{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid #e2e5eb;border-radius:7px;cursor:pointer;font-size:13px}.layer.selected{background:#e5f0fe;border-color:#87b0e5}.layer .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layer input{margin:0}small{color:#647184}.status{position:fixed;bottom:8px;left:12px;padding:4px 9px;background:#fffce9;border-radius:5px;font-size:12px;color:#596274;pointer-events:none}.separator{width:1px;height:24px;background:#dce1e8}label{font-size:13px}#sizeText{display:inline-block;min-width:22px}#io{display:none}@media(max-width:760px){header{height:auto}main{height:calc(100dvh - 110px);grid-template-columns:minmax(0,1fr) 170px}.workspace{padding:12px}.sidebar{padding:8px}#paper{width:700px;height:490px}}
</style></head><body><header><h1>✎ 미니 그림판</h1><button id="pen" class="active">펜 (B)</button><button id="eraser">지우개 (E)</button><input id="color" aria-label="펜 색상" type="color" value="#111111"><label>굵기 <input id="size" type="range" min="1" max="60" value="5"><span id="sizeText">5</span></label><span class="separator"></span><button id="undo">↶ 실행 취소</button><button id="redo">↷ 다시 실행</button><span class="separator"></span><button id="savePNG">PNG 저장</button><button id="saveProject">작업 저장</button><label class="upload">작업 불러오기<input id="io" type="file" accept=".json,application/json"></label></header><main><section class="workspace"><div id="paper" aria-label="그림 영역"></div></section><aside class="sidebar"><h2>레이어</h2><div class="btns"><button id="add">+ 추가</button><button id="remove">삭제</button><button id="up">↑</button><button id="down">↓</button></div><div id="layers"></div><p><small>위쪽 레이어가 앞에 보입니다.<br>이름을 두 번 클릭하면 변경할 수 있습니다.<br><br>펜 입력과 마우스 모두 지원.<br>손떨림 보정 없음.<br>작업을 JSON으로 저장하면 레이어가 유지됩니다.</small></p></aside></main><div class="status" id="status">1000 × 700 · 브라우저에서만 동작 · 자동 업로드 없음</div><script>
(()=>{'use strict';const W=1000,H=700, paper=document.querySelector('#paper'),layersUI=document.querySelector('#layers'),status=document.querySelector('#status');let layers=[],activeId=null,tool='pen',size=5,color='#111111',drawing=false,last=null,pointerId=null,history=[],redo=[];let nextId=1;const $=s=>document.querySelector(s);
const newLayer=(name)=>{const c=document.createElement('canvas');c.width=W;c.height=H;c.dataset.layer='';c.getContext('2d',{willReadFrequently:false});const l={id:nextId++,name:name||'레이어 '+nextId,canvas:c,visible:true};layers.push(l);paper.append(c);activeId=l.id;sync();return l};const active=()=>layers.find(x=>x.id===activeId);const snapshot=()=>layers.map(l=>({id:l.id,name:l.name,visible:l.visible,data:l.canvas.toDataURL('image/png')}));const remember=()=>{history.push(snapshot());if(history.length>30)history.shift();redo.length=0;updateButtons()};const updateButtons=()=>{$('#undo').disabled=!history.length;$('#redo').disabled=!redo.length};
function sync(){layers.forEach((l,i)=>{l.canvas.style.zIndex=i;l.canvas.style.display=l.visible?'block':'none'});layersUI.innerHTML='';[...layers].reverse().forEach(l=>{const div=document.createElement('div');div.className='layer'+(l.id===activeId?' selected':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=l.visible;cb.title='표시 여부';cb.addEventListener('click',e=>e.stopPropagation());cb.addEventListener('change',()=>{remember();l.visible=cb.checked;sync()});const txt=document.createElement('span');txt.className='name';txt.textContent=l.name;txt.title='두 번 클릭하여 이름 변경';txt.ondblclick=e=>{e.stopPropagation();const name=prompt('레이어 이름',l.name);if(name&&name.trim()){remember();l.name=name.trim();sync()}};div.append(cb,txt);div.onclick=()=>{activeId=l.id;sync()};layersUI.append(div)});updateButtons()}
function point(e){const r=paper.getBoundingClientRect();return {x:Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width)),y:Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height))}}function paint(a,b,e){const l=active();if(!l||!l.visible)return;const ctx=l.canvas.getContext('2d');ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=size;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=tool==='eraser'?'#000':color;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}
paper.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;if(!active()?.visible)return;e.preventDefault();remember();paper.setPointerCapture(e.pointerId);pointerId=e.pointerId;drawing=true;last=point(e);paint(last,{x:last.x+.001,y:last.y+.001},e)});paper.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==pointerId)return;e.preventDefault();const ev=e.getCoalescedEvents?.()||[];const events=ev.length?ev:[e];for(const item of events){const p=point(item);paint(last,p,item);last=p}});const stop=e=>{if(e.pointerId===pointerId){drawing=false;last=null;pointerId=null}};paper.addEventListener('pointerup',stop);paper.addEventListener('pointercancel',stop);paper.addEventListener('lostpointercapture',()=>{drawing=false;last=null;pointerId=null});paper.addEventListener('contextmenu',e=>e.preventDefault());
const setTool=t=>{tool=t;$('#pen').classList.toggle('active',t==='pen');$('#eraser').classList.toggle('active',t==='eraser')};$('#pen').onclick=()=>setTool('pen');$('#eraser').onclick=()=>setTool('eraser');$('#size').oninput=e=>{$('#sizeText').textContent=size=+e.target.value};$('#color').oninput=e=>{color=e.target.value};$('#add').onclick=()=>{remember();newLayer()};$('#remove').onclick=()=>{if(layers.length<=1)return;remember();const ix=layers.findIndex(l=>l.id===activeId);layers[ix].canvas.remove();layers.splice(ix,1);activeId=layers[Math.max(0,ix-1)].id;sync()};function move(d){const i=layers.findIndex(l=>l.id===activeId),j=i+d;if(j<0||j>=layers.length)return;remember();[layers[i],layers[j]]=[layers[j],layers[i]];sync()}$('#up').onclick=()=>move(1);$('#down').onclick=()=>move(-1);
async function restore(state){drawing=false;layers.forEach(l=>l.canvas.remove());layers=[];let maxId=0;for(const o of state){const l=newLayer(o.name);l.id=o.id;l.visible=o.visible;maxId=Math.max(maxId,o.id);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=o.data});l.canvas.getContext('2d').drawImage(img,0,0)}nextId=maxId+1;activeId=layers[layers.length-1].id;sync()}
$('#undo').onclick=async()=>{if(!history.length)return;redo.push(snapshot());await restore(history.pop());updateButtons()};$('#redo').onclick=async()=>{if(!redo.length)return;history.push(snapshot());await restore(redo.pop());updateButtons()};function download(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}$('#savePNG').onclick=()=>{const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);layers.filter(l=>l.visible).forEach(l=>ctx.drawImage(l.canvas,0,0));canvas.toBlob(blob=>{if(blob)download(blob,'그림.png')},'image/png')};$('#saveProject').onclick=()=>{const json={version:1,width:W,height:H,layers:snapshot()};download(new Blob([JSON.stringify(json)],{type:'application/json'}),'그림-레이어.json')};$('#io').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const p=JSON.parse(await file.text());if(p.version!==1||p.width!==W||p.height!==H||!Array.isArray(p.layers)||p.layers.length>50)throw Error('지원하지 않는 작업 파일');history=[];redo=[];await restore(p.layers)}catch(err){alert('불러오기 실패: '+err.message)}e.target.value=''};window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;const k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();if(e.shiftKey)$('#redo').click();else $('#undo').click()}else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();$('#redo').click()}else if(k==='b')setTool('pen');else if(k==='e')setTool('eraser')});newLayer('레이어 1');})();
</script></body></html>
